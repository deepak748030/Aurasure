# Local MongoDB for Aurasure API development.
# Usage: docker compose up -d mongo
services:
  mongo:
    image: mongo:7
    container_name: aurasure-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aurasure
    volumes:
      - aurasure_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  aurasure_mongo_data:
